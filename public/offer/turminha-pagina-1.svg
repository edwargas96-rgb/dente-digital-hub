<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <rect width="300" height="400" fill="#fffdf5"/>
  <rect x="12" y="12" width="276" height="376" rx="8" fill="none" stroke="#e2d9bf" stroke-width="2"/>
  <text x="150" y="42" font-family="Archivo, Arial" font-size="16" font-weight="800" fill="#0a7d3c" text-anchor="middle">RESPEITO EM CASA</text>

  <!-- Simple house scene -->
  <rect x="70" y="130" width="160" height="120" fill="#f7d9b0"/>
  <polygon points="60,130 240,130 150,80" fill="#c94b3c"/>
  <rect x="130" y="180" width="40" height="70" fill="#6b3a1f"/>
  <rect x="90" y="150" width="30" height="30" fill="#8ac6ff"/>
  <rect x="180" y="150" width="30" height="30" fill="#8ac6ff"/>

  <!-- Two figures holding hands -->
  <g transform="translate(110,290)">
    <circle cx="0" cy="0" r="12" fill="#f2b98c"/>
    <rect x="-10" y="10" width="20" height="30" fill="#122b6b"/>
  </g>
  <g transform="translate(150,290)">
    <circle cx="0" cy="0" r="10" fill="#f5c39a"/>
    <rect x="-8" y="9" width="16" height="26" fill="#f7c948"/>
  </g>
  <g transform="translate(185,290)">
    <circle cx="0" cy="0" r="12" fill="#e6a978"/>
    <rect x="-10" y="10" width="20" height="30" fill="#0a7d3c"/>
  </g>

  <text x="150" y="370" font-family="Archivo, Arial" font-size="11" fill="#5a6a5f" text-anchor="middle">"Em casa aprendemos a ouvir, respeitar e ajudar."</text>
</svg>
