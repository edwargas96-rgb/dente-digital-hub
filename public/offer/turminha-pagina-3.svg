<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <rect width="300" height="400" fill="#fffdf5"/>
  <rect x="12" y="12" width="276" height="376" rx="8" fill="none" stroke="#e2d9bf" stroke-width="2"/>
  <text x="150" y="42" font-family="Archivo, Arial" font-size="16" font-weight="800" fill="#c94b3c" text-anchor="middle">HONESTIDADE</text>

  <!-- Classroom scene -->
  <rect x="30" y="80" width="240" height="150" fill="#eef1e5"/>
  <rect x="60" y="120" width="180" height="90" rx="4" fill="#0a7d3c"/>
  <text x="150" y="160" font-family="Archivo, Arial" font-size="14" font-weight="800" fill="#fffdf5" text-anchor="middle">2 + 2 = 4</text>
  <text x="150" y="185" font-family="Archivo, Arial" font-size="10" fill="#f7c948" text-anchor="middle">A verdade sempre soma.</text>

  <g transform="translate(90,280)">
    <circle cx="0" cy="0" r="14" fill="#f5c39a"/>
    <rect x="-12" y="12" width="24" height="34" fill="#f7c948"/>
  </g>
  <g transform="translate(150,280)">
    <circle cx="0" cy="0" r="14" fill="#f2b98c"/>
    <rect x="-12" y="12" width="24" height="34" fill="#122b6b"/>
  </g>
  <g transform="translate(210,280)">
    <circle cx="0" cy="0" r="14" fill="#e6a978"/>
    <rect x="-12" y="12" width="24" height="34" fill="#c94b3c"/>
  </g>

  <text x="150" y="370" font-family="Archivo, Arial" font-size="11" fill="#5a6a5f" text-anchor="middle">"Falar a verdade é um ato de coragem."</text>
</svg>
