<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122b6b"/>
      <stop offset="1" stop-color="#0a1e4e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ac6ff"/>
      <stop offset="1" stop-color="#d9ecff"/>
    </linearGradient>
  </defs>
  <rect width="360" height="480" rx="14" fill="url(#bg)"/>
  <rect x="18" y="18" width="324" height="444" rx="8" fill="#fffdf5"/>

  <!-- Sky panel -->
  <rect x="30" y="120" width="300" height="180" rx="6" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="300" cy="150" r="22" fill="#f7c948"/>
  <!-- Hills -->
  <path d="M30 260 Q 110 200 200 240 T 330 250 L 330 300 L 30 300 Z" fill="#0a7d3c"/>
  <path d="M30 275 Q 130 235 230 260 T 330 275 L 330 300 L 30 300 Z" fill="#0f5232"/>

  <!-- Three kid silhouettes (generic, no likeness) -->
  <g transform="translate(90,180)">
    <circle cx="0" cy="0" r="18" fill="#f5c39a"/>
    <rect x="-15" y="16" width="30" height="46" rx="6" fill="#f7c948"/>
    <rect x="-15" y="16" width="30" height="8" fill="#0a7d3c"/>
  </g>
  <g transform="translate(180,175)">
    <circle cx="0" cy="0" r="20" fill="#e6a978"/>
    <rect x="-17" y="18" width="34" height="52" rx="6" fill="#122b6b"/>
    <rect x="-17" y="18" width="34" height="10" fill="#f7c948"/>
  </g>
  <g transform="translate(260,182)">
    <circle cx="0" cy="0" r="17" fill="#f2b98c"/>
    <rect x="-14" y="15" width="28" height="44" rx="6" fill="#0a7d3c"/>
    <rect x="-14" y="15" width="28" height="8" fill="#f7c948"/>
  </g>

  <!-- Title band -->
  <rect x="30" y="330" width="300" height="72" rx="6" fill="#0a7d3c"/>
  <text x="180" y="360" font-family="Archivo, Arial" font-size="26" font-weight="900" fill="#f7c948" text-anchor="middle">TURMINHA</text>
  <text x="180" y="388" font-family="Archivo, Arial" font-size="26" font-weight="900" fill="#fffdf5" text-anchor="middle">DO BEM</text>

  <!-- Subtitle -->
  <text x="180" y="428" font-family="Archivo, Arial" font-size="12" font-weight="700" fill="#122b6b" text-anchor="middle">Valores que formam cidadãos de verdade</text>
  <text x="180" y="446" font-family="Archivo, Arial" font-size="10" font-weight="600" fill="#5a6a5f" text-anchor="middle">Livro digital ilustrado • Idade 5 a 10 anos</text>

  <!-- Corner star badge -->
  <g transform="translate(310,50) rotate(12)">
    <circle r="30" fill="#f7c948"/>
    <text y="-2" font-family="Archivo, Arial" font-size="9" font-weight="900" fill="#122b6b" text-anchor="middle">EDIÇÃO</text>
    <text y="12" font-family="Archivo, Arial" font-size="10" font-weight="900" fill="#122b6b" text-anchor="middle">2026</text>
  </g>
</svg>
